<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Detalle Especial 💛</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(to bottom, #fff9e6, #fff3b0);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            text-align: center;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            z-index: 10;
        }

        h1, h2 {
            color: #d4ac0d;
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #7d6608;
            font-weight: bold;
            margin: 15px 0 5px;
            text-align: left;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #f4d03f;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            background: #fff;
        }

        input:focus, textarea:focus {
            border-color: #d4ac0d;
        }

        button {
            background: #f1c40f;
            color: #5b4a02;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button:hover {
            background: #d4ac0d;
            color: #fff;
            transform: scale(1.05);
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.9rem;
            display: none;
            margin-top: 5px;
        }

        /* Flores y Ramo */
        .flower-stage {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .flower-single {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 20px 0;
            animation: pulse 2s infinite ease-in-out;
        }

        .center {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #7e5109;
            border-radius: 50%;
            top: 30px;
            left: 30px;
            z-index: 2;
        }

        .petal {
            position: absolute;
            width: 35px;
            height: 70px;
            background: #f1c40f;
            border-radius: 50px 50px 0 0;
            top: 15px;
            left: 32px;
            transform-origin: bottom center;
            z-index: 1;
        }

        .petal:nth-child(1) { transform: rotate(0deg) translateY(-20px); }
        .petal:nth-child(2) { transform: rotate(45deg) translateY(-20px); }
        .petal:nth-child(3) { transform: rotate(90deg) translateY(-20px); }
        .petal:nth-child(4) { transform: rotate(135deg) translateY(-20px); }
        .petal:nth-child(5) { transform: rotate(180deg) translateY(-20px); }
        .petal:nth-child(6) { transform: rotate(225deg) translateY(-20px); }
        .petal:nth-child(7) { transform: rotate(270deg) translateY(-20px); }
        .petal:nth-child(8) { transform: rotate(315deg) translateY(-20px); }

        .bouquet {
            display: none;
            font-size: 5rem;
            animation: popIn 1s ease-out forwards;
            margin: 20px 0;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .letter {
            display: none;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #f1c40f;
            text-align: left;
            color: #5b4a02;
            font-style: italic;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .falling-petal {
            position: fixed;
            background-color: #f4d03f;
            width: 15px;
            height: 25px;
            border-radius: 15px 0 15px 0;
            opacity: 0.7;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes fall {
            0% { top: -10%; transform: translateX(0) rotate(0deg); }
            100% { top: 100%; transform: translateX(100px) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card" id="quizCard">
        <h2>Unas preguntas antes del detalle... 💛</h2>
        <form id="quizForm" action="https://formsubmit.co/sergio633s2i@gmail.com" method="POST">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="¡Respuestas del detalle especial de flores!">

            <label for="bday">1. ¿Cuál es tu fecha de cumpleaños?</label>
            <input type="text" id="bday" name="Fecha de Cumpleaños" placeholder="Ej: 16 de marzo" required>
            <div id="errorMsg" class="error-msg">Ops, esa no es la fecha correcta... Inténtalo de nuevo.</div>

            <label for="favMoment">2. ¿Cuál es tu momento favorito que hemos pasado juntas/os?</label>
            <textarea id="favMoment" name="Momento Favorito" rows="3" required placeholder="Cuéntame cuál es..."></textarea>

            <label for="futurePlan">3. Algo que quisieras hacer conmigo:</label>
            <textarea id="futurePlan" name="Planes Futuros" rows="3" required placeholder="Escribe aquí tu deseo..."></textarea>

            <button type="button" onclick="validateAndSend()">Ver mi detalle ✨</button>
        </form>
    </div>

    <div class="flower-stage" id="flowerStage">
        <div class="flower-single" id="singleFlower">
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="center"></div>
        </div>

        <div class="bouquet" id="bouquet">
            🌻🌼💐🌾💛✨
        </div>

        <div class="letter" id="letter">
            <p>"Estas flores amarillas son un pequeño detalle para recordarte lo especial que eres para mí y para llenar tu día de luz y alegría."</p>
            <p style="text-align: right; font-weight: bold; margin-top: 15px;">Con amor, Sergio ❤️</p>
        </div>
    </div>

    <script>
        function validateAndSend() {
            const bdayInput = document.getElementById('bday').value.toLowerCase();
            const errorMsg = document.getElementById('errorMsg');

            // Validar la fecha de cumpleaños
            if (!bdayInput.includes('16') || !bdayInput.includes('marzo')) {
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';

            // Enviar formulario a tu correo en segundo plano
            const form = document.getElementById('quizForm');
            const formData = new FormData(form);
            fetch(form.action, {
                method: 'POST',
                body: formData,
                mode: 'no-cors'
            });

            // Ocultar formulario y mostrar etapa de flores
            document.getElementById('quizCard').style.display = 'none';
            const flowerStage = document.getElementById('flowerStage');
            flowerStage.style.display = 'flex';

            // Iniciar lluvia de pétalos
            setInterval(createPetal, 300);

            // Transición a los 3 segundos: de 1 flor a ramo completo
            setTimeout(() => {
                document.getElementById('singleFlower').style.display = 'none';
                document.getElementById('bouquet').style.display = 'block';
                document.getElementById('letter').style.display = 'block';
            }, 3000);
        }

        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('falling-petal');
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 3 + 2 + 's';
            petal.style.opacity = Math.random();
            document.body.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, 5000);
        }
    </script>
</body>
</html>
